version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: axum_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: axum_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axum_network

  redis:
    image: redis:7-alpine
    container_name: axum_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axum_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: axum_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axum_network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: axum_jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686" # Jaeger UI
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    networks:
      - axum_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axum_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/axum_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      PORT: 3000
      HOST: 0.0.0.0
      APP_NAME: axum-api-server
      ENVIRONMENT: development
      LOG_LEVEL: info
      JWT_SECRET: your-secret-key-change-in-production
      JWT_EXPIRATION_HOURS: 24
      ENABLE_METRICS: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - axum_network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  axum_network:
    driver: bridge
