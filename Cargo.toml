[package]
name = "zero2prod"
version = "0.1.0"
authors = ["zhengpanone <zhengpanone@hotmail.com>"]
edition = "2021"


[dependencies]
anyhow = "1.0.80"
axum = { version = "0.7.4", features = ["default"] }
axum-extra = { version = "0.9.3", features = ["typed-header"] }
dotenvy = "0.15.7"
http = "1.0.0"
jsonwebtoken = "9.3.0"
lazy_static = "1.4.0"
reqwest = { version = "0.12.5", features = ["json", "rustls-tls", "multipart"],default-features=false}
serde = { version = "1.0.197", features = ["derive"]}
serde_json = "1.0.114"
serde_yaml = "0.9.34"
sqlx = { version = "0.7.3", features = ["sqlite", "runtime-tokio", "tls-rustls", "time"] }
time = { version = "0.3.34", features = ["serde-human-readable", "local-offset"] }
tokio = { version = "1.36.0", features = ["full"] }
tower = { version = "0.4.13", features = ["timeout"] }
tower-http = { version = "0.5.2", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
askama = "0.12"
rand = "0.8.5"
hyper = "1.4.1"
mime = "0.3.17"
uuid = { version = "1.10.0", features = ["v4"] }
bytes = "1.7.1"
thiserror = "1.0.63"
bcrypt = "0.15.1"
argon2 = "0.5.3"
ring = "0.16"
hex = "0.4.3"
async-trait = "0.1.82"

