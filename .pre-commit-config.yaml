fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-byte-order-marker
        files: ^backend/.*$|^frontend/.*$
      - id: check-case-conflict
        files: ^backend/.*$|^frontend/.*$
      - id: check-merge-conflict
        files: ^backend/.*$|^frontend/.*$
      - id: check-symlinks
        files: ^backend/.*$|^frontend/.*$
      - id: check-yaml
        files: ^backend/.*\.(ya?ml)$|^frontend/.*\.(ya?ml)$
      - id: end-of-file-fixer
        files: ^backend/.*$|^frontend/.*$
      - id: mixed-line-ending
        files: ^backend/.*$|^frontend/.*$
      - id: trailing-whitespace
        files: ^backend/.*$|^frontend/.*$
  - repo: https://github.com/psf/black
    rev: 22.10.0
    hooks:
      - id: black

  # Backend (Rust) — 使用本地脚本通过 cd backend && ...
  - repo: local
    hooks:
      - id: cargo-fmt-backend
        name: cargo fmt (backend check)
        entry: bash -c 'cd backend && cargo fmt -- --check'
        language: rust
        files: ^backend/.*\.rs$
        pass_filenames: false

      - id: cargo-deny-backend
        name: cargo deny (backend)
        entry: bash -c 'cd backend && cargo deny check -d'
        language: rust
        files: ^backend/.*\.rs$
        pass_filenames: false

      - id: cargo-check-backend
        name: cargo check
        entry: bash -c 'cd backend && cargo check --all'
        language: rust
        files: ^backend/.*\.rs$
        pass_filenames: false

      - id: cargo-clippy-backend
        name: cargo clippy
        entry: bash -c 'cd backend && cargo clippy --all-targets --all-features --tests --benches -- -D warnings'
        language: rust
        files: ^backend/.*\.rs$
        pass_filenames: false

      - id: cargo-test-backend
        name: cargo test
        entry: bash -c 'cd backend && cargo nextest run --all-features'
        language: rust
        files: ^backend/.*\.rs$
        pass_filenames: false

      - id: typos-backend
        name: typos
        entry: bash -c 'cd backend && typos'
        language: rust
        files: ^backend/.*\.rs$
        pass_filenames: false

      # Frontend (Vue) — use npx to ensure project-local tooling
      - id: prettier-frontend
        name: prettier (frontend check)
        entry: bash -c 'cd frontend/zero2prod-manage && npx prettier --check "**/*.{js,ts,jsx,tsx,vue,css,scss,json,md}"'
        language: system
        files: ^frontend/zero2prod-manage/.*\.(js|ts|jsx|tsx|vue|css|scss|json|md)$
        pass_filenames: false

      - id: eslint-frontend
        name: eslint (frontend)
        entry: bash -c 'cd frontend/zero2prod-manage && npx eslint --ext .js,.ts,.vue .'
        language: system
        files: ^frontend/zero2prod-manage/.*\.(js|ts|jsx|tsx|vue)$
        pass_filenames: false
